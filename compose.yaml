# Preserve the existing Compose project and its volumes after moving this file.
name: zed
services:
  api:
    build: ../../api
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../../api:/app
      - api_modules:/app/node_modules
    environment:
      WRANGLER_SEND_METRICS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  web:
    build: .
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - web_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8787
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api:
        condition: service_healthy
volumes:
  api_modules:
  web_modules:
